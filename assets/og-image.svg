    <line x1="520" y1="295" x2="680" y2="295"/>
    <line x1="600" y1="175" x2="600" y2="335"/>
  </g>

  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">
    <text x="556" y="207">5</text>
    <text x="640" y="207">1</text>
    <text x="560" y="287">2</text>
    <text x="640" y="287">8</text>
    <text x="600" y="327">4</text>
  </g>

  <text x="600" y="470" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">Ascendoku</text>
  <text x="600" y="518" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" opacity="0.9" text-anchor="middle">Free Online Sudoku &bull; XP &bull; Ranks &bull; Daily Challenges</text>
