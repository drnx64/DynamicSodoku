    <line x1="900" y1="470" x2="1140" y2="470"/>
  </g>

  <rect x="480" y="135" width="240" height="240" rx="22" fill="#0f0f1a" opacity="0.38" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5">
    <line x1="520" y1="215" x2="680" y2="215"/>
    <line x1="520" y1="295" x2="680" y2="295"/>
    <line x1="600" y1="175" x2="600" y2="335"/>
    <line x1="520" y1="215" x2="600" y2="215"/>
  </g>
  <g stroke="#ffffff" stroke-width="3">
