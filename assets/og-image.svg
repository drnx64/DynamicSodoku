<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7c5cfc" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7c5cfc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="315" r="430" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <g stroke="rgba(255,255,255,0.14)" stroke-width="2">
    <line x1="60" y1="150" x2="260" y2="150"/>
    <line x1="60" y1="180" x2="260" y2="180"/>
    <line x1="60" y1="210" x2="260" y2="210"/>
    <line x1="900" y1="410" x2="1140" y2="410"/>
